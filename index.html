<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>World Tracker</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                Arial,
                sans-serif;

            background: #07111f;
            color: white;
            overflow: hidden;
        }

        #app {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .topbar {
            position: absolute;
            z-index: 1000;
            top: 15px;
            left: 15px;
            right: 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            pointer-events: none;
        }

        .brand,
        .user-box {
            pointer-events: auto;
        }

        .brand {
            padding: 11px 16px;
            border-radius: 14px;

            background: rgba(5, 15, 30, 0.88);
            backdrop-filter: blur(14px);

            font-size: 19px;
            font-weight: 800;

            box-shadow:
                0 8px 30px rgba(0,0,0,.25);
        }

        .user-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 11px;
            padding: 10px 14px;

            background: #1683ff;
            color: white;

            cursor: pointer;
            font-weight: 700;

            transition:
                transform .15s,
                opacity .15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.secondary {
            background: rgba(5,15,30,.88);
            backdrop-filter: blur(12px);
        }

        button.danger {
            background: #d9304f;
        }

        .panel {
            position: absolute;
            z-index: 1000;

            top: 75px;
            left: 15px;

            width: 320px;
            max-height: calc(100vh - 95px);

            overflow-y: auto;

            background: rgba(5, 15, 30, .91);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,.1);

            border-radius: 18px;

            padding: 15px;

            box-shadow:
                0 15px 50px rgba(0,0,0,.35);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        .status {
            background: rgba(255,255,255,.06);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .status-title {
            font-size: 12px;
            opacity: .65;
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 18px;
            font-weight: 800;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .controls button {
            width: 100%;
        }

        .full {
            grid-column: 1 / -1;
        }

        .map-switch {
            position: absolute;
            z-index: 1000;

            right: 15px;
            top: 75px;

            background: rgba(5,15,30,.9);
            backdrop-filter: blur(15px);

            padding: 5px;
            border-radius: 13px;

            display: flex;
            gap: 5px;
        }

        .map-switch button {
            background: transparent;
        }

        .map-switch button.active {
            background: #1683ff;
        }

        .route-info {
            margin-top: 10px;
        }

        .segment {
            background: rgba(255,255,255,.06);
            border-radius: 10px;
            padding: 10px;
            margin-top: 7px;
            cursor: pointer;
        }

        .segment:hover {
            background: rgba(22,131,255,.18);
        }

        .history {
            display: none;
        }

        .history-item {
            padding: 11px;
            margin-top: 7px;
            border-radius: 11px;
            background: rgba(255,255,255,.06);
            cursor: pointer;
        }

        .history-item:hover {
            background: rgba(22,131,255,.18);
        }

        .modal {
            display: none;

            position: fixed;
            z-index: 3000;
            inset: 0;

            background: rgba(0,0,0,.6);

            align-items: center;
            justify-content: center;
        }

        .modal-card {
            width: min(390px, calc(100vw - 30px));

            padding: 22px;

            border-radius: 18px;

            background: #081525;
            box-shadow: 0 20px 80px rgba(0,0,0,.5);
        }

        .modal-card h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 9px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12);

            background: rgba(255,255,255,.07);
            color: white;

            outline: none;
        }

        .auth-buttons {
            display: flex;
            gap: 8px;
        }

        .leaflet-control-attribution {
            font-size: 10px;
        }

        @media (max-width: 700px) {
            .panel {
                width: calc(100vw - 30px);
                max-height: 52vh;
            }

            .map-switch {
                top: auto;
                bottom: 15px;
            }

            .topbar {
                top: 8px;
                left: 8px;
                right: 8px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <div id="map"></div>

    <div class="topbar">

        <div class="brand">
            🌍 World Tracker
        </div>

        <div class="user-box">

            <button
                id="historyButton"
                class="secondary"
            >
                История
            </button>

            <button
                id="authButton"
            >
                Войти
            </button>

        </div>

    </div>

    <div class="map-switch">

        <button
            id="standardMapButton"
            class="active"
        >
            Карта
        </button>

        <button
            id="satelliteMapButton"
        >
            Спутник
        </button>

    </div>

    <div class="panel">

        <h2>Текущий маршрут</h2>

        <div class="status">
            <div class="status-title">
                Местоположение
            </div>

            <div
                id="locationStatus"
                class="status-value"
            >
                Определение...
            </div>
        </div>

        <div class="status">

            <div class="status-title">
                Цель
            </div>

            <div
                id="destinationStatus"
                class="status-value"
            >
                Нажми на карту
            </div>

        </div>

        <div class="status">

            <div class="status-title">
                Расстояние
            </div>

            <div
                id="distanceStatus"
                class="status-value"
            >
                —
            </div>

        </div>

        <div class="status">

            <div class="status-title">
                Время
            </div>

            <div
                id="timeStatus"
                class="status-value"
            >
                —
            </div>

        </div>

        <div class="status">

            <div class="status-title">
                Текущая скорость
            </div>

            <div
                id="speedStatus"
                class="status-value"
            >
                —
            </div>

        </div>

        <div class="controls">

            <button
                id="startButton"
                class="full"
            >
                Начать маршрут
            </button>

            <button
                id="finishButton"
                class="danger full"
                style="display:none"
            >
                Завершить маршрут
            </button>

            <button
                id="myLocationButton"
                class="secondary"
            >
                📍 Я
            </button>

            <button
                id="clearButton"
                class="secondary"
            >
                Очистить
            </button>

        </div>

        <div
            id="segmentsContainer"
            class="route-info"
        ></div>

    </div>


    <div
        id="historyPanel"
        class="panel history"
    >

        <h2>Мои маршруты</h2>

        <div id="historyList">
            Загрузка...
        </div>

    </div>


    <div
        id="authModal"
        class="modal"
    >

        <div class="modal-card">

            <h2 id="authTitle">
                Вход
            </h2>

            <input
                id="usernameInput"
                placeholder="Имя пользователя"
                autocomplete="username"
            >

            <input
                id="passwordInput"
                type="password"
                placeholder="Пароль"
                autocomplete="current-password"
            >

            <div class="auth-buttons">

                <button
                    id="loginButton"
                >
                    Войти
                </button>

                <button
                    id="registerButton"
                    class="secondary"
                >
                    Регистрация
                </button>

                <button
                    id="closeAuthButton"
                    class="secondary"
                >
                    ✕
                </button>

            </div>

            <p
                id="authMessage"
                style="opacity:.7"
            ></p>

        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>

</body>
</html>
