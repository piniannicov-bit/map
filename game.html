<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>World Tracker — Racing</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050b16;
            font-family: Arial, sans-serif;
            color: white;
        }

        #game {
            width: 100%;
            height: 100%;
            display: block;
        }

        #menu {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, rgba(20,70,130,.35), transparent 55%),
                linear-gradient(135deg, #050b16, #0a1c35);
        }

        .menu-card {
            width: min(92%, 480px);
            padding: 30px;
            border-radius: 25px;
            background: rgba(8, 18, 35, .94);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 25px 80px rgba(0,0,0,.55);
            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .subtitle {
            opacity: .65;
            margin-bottom: 28px;
        }

        .section-title {
            text-align: left;
            font-size: 14px;
            opacity: .65;
            margin: 18px 0 10px;
        }

        .colors {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 9px;
        }

        .color {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: .15s;
        }

        .color.selected {
            border-color: white;
            transform: scale(1.12);
            box-shadow: 0 0 18px rgba(255,255,255,.5);
        }

        #playerName {
            margin-top: 10px;
            font-size: 17px;
            opacity: .75;
        }

        button {
            border: 0;
            cursor: pointer;
            color: white;
            font-weight: 800;
        }

        #startRace {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border-radius: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #087cff, #0051c9);
            box-shadow: 0 10px 30px rgba(0,100,255,.3);
        }

        #startRace:active {
            transform: scale(.98);
        }

        #backButton {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border-radius: 13px;
            background: rgba(255,255,255,.08);
        }

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        .hud-top {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .hud-box {
            padding: 10px 15px;
            border-radius: 13px;
            background: rgba(5,12,25,.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.1);
            font-weight: 800;
        }

        #speed {
            font-size: 22px;
        }

        #position {
            font-size: 22px;
        }

        #countdown {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            font-weight: 1000;
            text-shadow: 0 10px 50px black;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            gap: 10px;
        }

        .control {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: rgba(5,12,25,.75);
            border: 1px solid rgba(255,255,255,.12);
            font-size: 26px;
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        .control:active {
            background: rgba(30,120,255,.8);
        }

        #finishPanel {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(10px);
        }

        .finish-card {
            width: min(92%, 450px);
            padding: 30px;
            text-align: center;
            border-radius: 25px;
            background: #081528;
            border: 1px solid rgba(255,255,255,.12);
        }

        .finish-title {
            font-size: 35px;
            font-weight: 1000;
        }

        .result {
            margin: 20px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-item {
            padding: 15px;
            border-radius: 14px;
            background: rgba(255,255,255,.06);
        }

        .result-label {
            opacity: .55;
            font-size: 12px;
        }

        .result-value {
            margin-top: 5px;
            font-size: 21px;
            font-weight: 900;
        }

        #restartButton {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            background: #087cff;
            font-size: 17px;
        }

        #historyButton {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 30;
            padding: 10px 15px;
            border-radius: 12px;
            background: rgba(5,12,25,.8);
        }

        @media (min-width: 800px) {
            #controls {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 500px;
            }
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MAIN MENU -->
<div id="menu">

    <div class="menu-card">

        <div class="logo">🏁 RACING</div>
        <div class="subtitle">World Tracker Racing</div>

        <div id="playerName">Игрок</div>

        <div class="section-title">
            ВЫБЕРИ ЦВЕТ МАШИНЫ
        </div>

        <div class="colors">

            <button class="color selected"
                    data-color="#1683ff"
                    style="background:#1683ff"></button>

            <button class="color"
                    data-color="#ff2525"
                    style="background:#ff2525"></button>

            <button class="color"
                    data-color="#18c964"
                    style="background:#18c964"></button>

            <button class="color"
                    data-color="#ffd21f"
                    style="background:#ffd21f"></button>

            <button class="color"
                    data-color="#b23cff"
                    style="background:#b23cff"></button>

            <button class="color"
                    data-color="#ffffff"
                    style="background:#ffffff"></button>

        </div>

        <button id="startRace">
            🏁 НАЧАТЬ ГОНКУ
        </button>

        <button id="backButton">
            ← Вернуться на карту
        </button>

    </div>

</div>


<!-- HUD -->
<div id="hud">

    <div class="hud-top">

        <div class="hud-box">
            Позиция:
            <span id="position">1/5</span>
        </div>

        <div class="hud-box">
            <span id="speed">0</span> км/ч
        </div>

        <div class="hud-box">
            Круг:
            <span id="lap">1/3</span>
        </div>

    </div>

    <div id="countdown"></div>

    <div id="controls">

        <div class="control-group">
            <button class="control" id="left">◀</button>
            <button class="control" id="right">▶</button>
        </div>

        <div class="control-group">
            <button class="control" id="brake">▼</button>
            <button class="control" id="gas">▲</button>
        </div>

    </div>

</div>


<!-- FINISH -->
<div id="finishPanel">

    <div class="finish-card">

        <div class="finish-title">
            🏆 ФИНИШ!
        </div>

        <div class="result">

            <div class="result-item">
                <div class="result-label">ПОЗИЦИЯ</div>
                <div class="result-value" id="finalPosition">1/5</div>
            </div>

            <div class="result-item">
                <div class="result-label">ВРЕМЯ</div>
                <div class="result-value" id="finalTime">0:00</div>
            </div>

            <div class="result-item">
                <div class="result-label">МАКС. СКОРОСТЬ</div>
                <div class="result-value" id="finalMaxSpeed">0 км/ч</div>
            </div>

            <div class="result-item">
                <div class="result-label">ДИСТАНЦИЯ</div>
                <div class="result-value" id="finalDistance">0 м</div>
            </div>

        </div>

        <button id="restartButton">
            🏁 ЕЩЁ РАЗ
        </button>

    </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module" src="/game.js"></script>

</body>
</html>
